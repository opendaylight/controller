[tox]
skipsdist = true
envlist =
    publish

[testenv:publish]
description = Build the controller_testlib wheel/sdist, sanity-check it imports cleanly, and upload to the local Nexus pypi-local repository
skip_install = true
passenv =
    TWINE_USERNAME
    TWINE_PASSWORD
setenv =
    TWINE_REPOSITORY_URL = {env:TWINE_REPOSITORY_URL:http://localhost:8081/repository/pypi-local/}
    SKIP_SMOKE_CHECK = {env:SKIP_SMOKE_CHECK:false}
deps =
    build>=1.2
    twine>=6.0
commands =
    python -c "import shutil; shutil.rmtree(r'{toxinidir}/controller_testlib/dist', ignore_errors=True)"
    python -m build --outdir {toxinidir}/controller_testlib/dist {toxinidir}/controller_testlib
    python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', *glob.glob(r'{toxinidir}/controller_testlib/dist/*.whl')])"
    python -c "import importlib, os, pkgutil; import controller_testlib as p; [importlib.import_module(m.name) for m in pkgutil.walk_packages(p.__path__, p.__name__ + '.')] if os.environ.get('SKIP_SMOKE_CHECK', 'false').lower() != 'true' else print('Skipping smoke import-check (SKIP_SMOKE_CHECK=true)')"
    twine upload {toxinidir}/controller_testlib/dist/*
