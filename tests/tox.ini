[tox]
skipsdist = true
envlist =
    publish

[testenv:publish]
description = Build the controller_testlib wheel/sdist and upload them to the local Nexus pypi-local repository
skip_install = true
passenv =
    TWINE_USERNAME
    TWINE_PASSWORD
setenv =
    TWINE_REPOSITORY_URL = {env:TWINE_REPOSITORY_URL:http://localhost:8081/repository/pypi-local/}
deps =
    build>=1.2
    twine>=6.0
commands =
    python -m build --outdir {toxinidir}/controller_testlib/dist {toxinidir}/controller_testlib
    twine upload {toxinidir}/controller_testlib/dist/*
