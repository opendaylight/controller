[tox]
skipsdist = true
envlist =
    import-check

[testenv]
deps =
    -r{toxinidir}/requirements.txt

[testenv:import-check]
description = Sanity-check that a freshly-built testlib jar's payload (e.g.
    controller-testlib/target/classes) actually imports cleanly, the same way
    a downstream project like netconf or bgpcep would end up importing it,
    before it gets published. Usage: tox -e import-check -- <path-to-target/classes> <package-name>
commands =
    python -c "import sys; sys.path.insert(0, sys.argv[1]); sys.path.insert(0, '{toxinidir}'); import importlib, pkgutil; p = importlib.import_module(sys.argv[2]); [importlib.import_module(m.name) for m in pkgutil.walk_packages(p.__path__, p.__name__ + '.')]" {posargs}
