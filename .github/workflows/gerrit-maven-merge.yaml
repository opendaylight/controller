---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

name: Gerrit Composed Maven Merge

# yamllint disable-line rule:truthy
on:
  # Daily SNAPSHOT rebuild. The Jenkins job this replaces ran @daily,
  # which kept SNAPSHOTs fresh against upstream dependency updates even
  # when nothing merged here. Disabling that job removes the rebuild,
  # so it is restored here on a slot staggered from the other migrated
  # projects to spread Nexus load.
  schedule:
    - cron: "49 9 * * *"
  workflow_dispatch:
    inputs:
      GERRIT_BRANCH:
        description: "Branch that change is against"
        required: true
        type: string
      GERRIT_CHANGE_ID:
        description: "The ID for the change"
        required: true
        type: string
      GERRIT_CHANGE_NUMBER:
        description: "The Gerrit number"
        required: true
        type: string
      GERRIT_CHANGE_URL:
        description: "URL to the change"
        required: true
        type: string
      GERRIT_EVENT_TYPE:
        description: "Type of Gerrit event"
        required: true
        type: string
      GERRIT_PATCHSET_NUMBER:
        description: "The patch number for the change"
        required: true
        type: string
      GERRIT_PATCHSET_REVISION:
        description: "The revision sha"
        required: true
        type: string
      GERRIT_PROJECT:
        description: "Project in Gerrit"
        required: true
        type: string
      GERRIT_REFSPEC:
        description: "Gerrit refspec of change"
        required: true
        type: string

concurrency:
  # Scheduled runs carry no inputs, so they must fall back to the same
  # key a master merge uses, or the two triggers land in different
  # groups and publish to Nexus concurrently.
  # yamllint disable-line rule:line-length
  group: gerrit-maven-merge-${{ github.workflow }}-${{ github.event.inputs.GERRIT_BRANCH || 'master' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clear votes
        # A scheduled rebuild has no change to clear votes on. Guarding
        # the step rather than the job keeps this job succeeding, so the
        # needs: chain below is unaffected.
        if: github.event_name != 'schedule'
        # yamllint disable-line rule:line-length
        uses: lfit/gerrit-review-action@a1c036a59b94c8ab89de26d378f6a28cc7378b13 # v1.1.2
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_USER }}
          key: ${{ secrets.GERRIT_SSH_PRIVKEY }}
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          vote-type: clear
          comment-only: true
      - name: Allow replication
        run: sleep 10s

  maven-merge:
    needs: prepare
    # yamllint disable-line rule:line-length
    uses: lfit/releng-reusable-workflows/.github/workflows/compose-maven-merge.yaml@main
    # "secrets: inherit" does not cross organisations, and this workflow
    # lives in the lfit org, so the secrets have to be passed by name.
    secrets:
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
    with:
      # Empty on a scheduled run, where master is the only branch a
      # schedule can fire on.
      GERRIT_BRANCH: ${{ inputs.GERRIT_BRANCH || 'master' }}
      JDK_VERSION: "21"
      MVN_VERSION: "3.9.5"
      MVN_PHASES: "clean deploy"
      MVN_PARAMS: "-Dmerge"
      # Mirrors the Jenkins job's mvn-goals "clean deploy -Pdocs".
      MVN_PROFILES: "docs"
      # Intentionally omits -DaltDeploymentRepository; maven-build-action
      # already supplies it, and repeating it duplicates the flag.
      # yamllint disable rule:line-length
      MVN_OPTS: >-
        -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
        -Dmaven.repo.local=/tmp/r -Dorg.ops4j.pax.url.mvn.localRepository=/tmp/r
        -Dkaraf.keep.unpack
      # yamllint enable rule:line-length
      ENV_VARS: ${{ toJSON(vars) }}
      PUSH_NEXUS: true

  vote:
    # A scheduled rebuild has no change to vote on.
    if: ${{ always() && github.event_name != 'schedule' }}
    needs: [prepare, maven-merge]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get conclusion
        # yamllint disable-line rule:line-length
        uses: im-open/workflow-conclusion@8eac7f17381a6917bc04fec3e2c92e70ebc37526 # v3.0.0
      - name: Set vote
        # yamllint disable-line rule:line-length
        uses: lfit/gerrit-review-action@a1c036a59b94c8ab89de26d378f6a28cc7378b13 # v1.1.2
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_USER }}
          key: ${{ secrets.GERRIT_SSH_PRIVKEY }}
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          vote-type: ${{ env.WORKFLOW_CONCLUSION }}
