---
name: CLM Dependency Scan

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0" # Run weekly on Sunday at midnight UTC

permissions:
  contents: read

env:
  NEXUS_IQ_SERVER: https://nexus-iq.wl.linuxfoundation.org
  # Must match the JJB gerrit-maven-clm application id, which is built from
  # nexus-iq-namespace + project-name (see jjb/releng-templates-java.yaml).
  NEXUS_IQ_NAMESPACE: odl-
  NEXUS_IQ_STAGE: release

jobs:
  clm-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Java
        # yamllint disable-line rule:line-length
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Maven
        # yamllint disable-line rule:line-length
        uses: stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1 # v5
        with:
          maven-version: "3.9.5"

      - name: Maven build and CLM module index
        env:
          MAVEN_OPTS: "--add-opens=java.base/java.util=ALL-UNNAMED"
        run: |
          # yamllint disable rule:line-length
          mvn clean install dependency:tree com.sonatype.clm:clm-maven-plugin:2.41.0-02:index \
            -DskipTests \
            -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn

      - name: Obtain Nexus IQ application ID
        env:
          GERRIT_PROJECT: ${{ github.event.repository.name }}
        run: |
          REPO_DASHED="${GERRIT_PROJECT//\//-}"
          echo "APPLICATION_ID=${NEXUS_IQ_NAMESPACE}${REPO_DASHED}" >> "$GITHUB_ENV"

      - name: Nexus IQ policy evaluation
        # yamllint disable-line rule:line-length
        uses: sonatype-nexus-community/iq-github-action@8d2038fbbcb37dc613c28d160843dd0981a7fce8 # v2.1.0
        with:
          serverUrl: ${{ env.NEXUS_IQ_SERVER }}
          username: ${{ secrets.CLM_USER }}
          password: ${{ secrets.CLM_PASSWORD }}
          applicationId: ${{ env.APPLICATION_ID }}
          stage: ${{ env.NEXUS_IQ_STAGE }}
          target: "/"
          writePolicyEvaluationJson: "true"

      - name: Upload policy evaluation report
        if: ${{ always() }}
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sonatype-lifecycle-policy-eval
          path: sonatype-lifecycle-policy-eval.json
          if-no-files-found: warn
