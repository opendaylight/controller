name: Gerrit Composed Sonar Cloud

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      GERRIT_BRANCH:
        description: "Branch that change is against"
        required: true
        type: string
      GERRIT_CHANGE_ID:
        description: "The ID for the change"
        required: true
        type: string
      GERRIT_CHANGE_NUMBER:
        description: "The Gerrit number"
        required: true
        type: string
      GERRIT_CHANGE_URL:
        description: "URL to the change"
        required: true
        type: string
      GERRIT_EVENT_TYPE:
        description: "Type of Gerrit event"
        required: true
        type: string
      GERRIT_PATCHSET_NUMBER:
        description: "The patch number for the change"
        required: true
        type: string
      GERRIT_PATCHSET_REVISION:
        description: "The revision sha"
        required: true
        type: string
      GERRIT_PROJECT:
        description: "Project in Gerrit"
        required: true
        type: string
      GERRIT_REFSPEC:
        description: "Gerrit refspec of change"
        required: true
        type: string
  schedule:
    # Run weekly on Saturdays
    - cron: "30 5 * * 6"

concurrency:
  # yamllint disable-line rule:line-length
  group: sonar-${{ github.workflow }}-${{ github.event.inputs.GERRIT_BRANCH || 'master' }}-${{ github.event.inputs.GERRIT_CHANGE_ID || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  sonar-scan:
    permissions:
      contents: read
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/security-workflows/.github/workflows/sonarqube-cloud.yaml@d42518f4ad6d71408c9f05ab2d135a9a86bcb548 # v0.3.1
    with:
      # Gerrit dispatches carry a refspec and check out the change;
      # the weekly schedule leaves it empty and takes the branch.
      gerrit_refspec: ${{ inputs.GERRIT_REFSPEC || '' }}
      gerrit_project: ${{ inputs.GERRIT_PROJECT || '' }}
      gerrit_branch: ${{ inputs.GERRIT_BRANCH || '' }}
      ref: ${{ inputs.GERRIT_BRANCH || 'master' }}
      # Sonar reads bytecode and a coverage report, so build first.
      build_type: "maven"
      java_version: "21"
      mvn_version: "3.9.9"
      # Pinned to the version the legacy lane used; upgrading the
      # scanner is a separate change.
      maven_sonar_plugin_version: "3.9.1.2184"
      mvn_phases: >-
        clean
        install
      mvn_params: >-
        -Dskip.karaf.featureTest=true
      sonar_project_key: "opendaylight_controller"
      sonar_organization: "opendaylight"
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}
      # The legacy workflow read vars.GLOBAL_SETTINGS internally;
      # this one takes it from the caller, and ODL needs it to
      # resolve snapshot dependencies.
      maven_global_settings: ${{ vars.GLOBAL_SETTINGS }}
